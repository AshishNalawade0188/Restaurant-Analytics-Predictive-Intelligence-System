<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prediction result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5"><div class="card shadow-sm mx-auto" style="max-width: 620px"><div class="card-body p-4">
    <h1 class="h3">{{ config.name }}</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% else %}
      <div class="alert alert-success fs-5">{{ result }}</div>
      {% if score is not none %}<p class="mb-0">Model confidence: <strong>{{ '%.1f'|format(score * 100) }}%</strong></p>{% endif %}
    {% endif %}
    <a class="btn btn-outline-secondary mt-3" href="{{ url_for('index') }}">Back to dashboard</a>
  </div></div></main>
</body>
</html>
